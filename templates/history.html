<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Çalışma Geçmişi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-4 rounded shadow">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>📚 Çalışma Seans Geçmişiniz</h2>
            <a href="/" class="btn btn-primary">Ana Sayfaya Dön</a>
        </div>
        
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Ders Adı</th>
                    <th>Süre (Dk)</th>
                    <th>Verimlilik</th>
                    <th>Notlar</th>
                    <th>Tarih</th>
                </tr>
            </thead>
            <tbody>
                {% for row in sessions %}
                <tr>
                    <td>{{ row['course_name'] }}</td>
                    <td>{{ row['duration_minutes'] }}</td>
                    <td>
                        <span class="badge {% if row['how_it_went'] == 'Productive' %}bg-success{% elif row['how_it_went'] == 'Neutral' %}bg-warning{% else %}bg-danger{% endif %}">
                            {{ row['how_it_went'] }}
                        </span>
                    </td>
                    <td>{{ row['notes'] or '-' }}</td>
                    <td>{{ row['end_time'] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
